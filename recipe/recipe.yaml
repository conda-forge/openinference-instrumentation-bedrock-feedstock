schema_version: 1

context:
  version: "0.1.71"
  build_number: "0"

package:
  name: openinference-instrumentation-bedrock
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openinference-instrumentation-bedrock/openinference_instrumentation_bedrock-${{ version }}.tar.gz
  sha256: ed8c46d7a161e8d8fd333efb1a42eaf306e485d455c9b5a553b468eec578eb9d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api
    - opentelemetry-instrumentation
    - opentelemetry-semantic-conventions
    - openinference-instrumentation >=0.1.82
    - openinference-semantic-conventions >=0.1.46
    - wrapt
    - dacite >=1.8.1
    - typing-extensions
    - botocore

tests:
  - python:
      imports:
        - openinference.instrumentation.bedrock
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*

about:
  summary: OpenInference Bedrock Instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Arize-ai/openinference

extra:
  recipe-maintainers:
    - michaelschiff
    - mikeldking
    - RogerHYang
    - axiomofjoy
    - anticorrelator
    - jsmolic
